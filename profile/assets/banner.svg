<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" fill="none" role="img" aria-label="Ișę — Nigeria's trusted task marketplace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cc0e0f"/>
      <stop offset="0.55" stop-color="#ee1e25"/>
      <stop offset="1" stop-color="#f54040"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="clip"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)"/>
  <g clip-path="url(#clip)">
    <circle cx="1120" cy="40" r="200" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="1210" cy="320" r="150" fill="#5c0808" fill-opacity="0.14"/>
    <circle cx="60" cy="300" r="120" fill="#ffffff" fill-opacity="0.04"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
    <!-- gentle sheen sweep -->
    <rect x="-420" y="-60" width="180" height="440" fill="#ffffff" fill-opacity="0.08" transform="skewX(-18)">
      <animate attributeName="x" values="-420;1560" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

