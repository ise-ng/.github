    <text x="286" y="206" font-size="29" font-weight="600" fill="#ffffff" fill-opacity="0.98">Nigeria's trusted task marketplace</text>
    <text x="286" y="240" font-size="17" font-style="italic" fill="#ffffff" fill-opacity="0.82">Ișę (ee-sheh) — Yoruba for &#8220;work.&#8221;</text>
    <g transform="translate(286,258)">
