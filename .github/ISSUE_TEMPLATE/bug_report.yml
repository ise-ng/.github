name: 🐛 Bug report
description: Something isn't working the way it should
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more detail you give us, the faster we can fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I tap "Post a task", the app...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: I expected the task to be created and...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen again?
      value: |
        1. Go to '...'
        2. Tap on '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recording
      description: Drag and drop any images or video here. Optional, but it helps a lot.
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device & OS
      placeholder: e.g. iPhone 13, iOS 17 / Samsung A14, Android 14
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser (if using the web app)
      placeholder: e.g. Chrome 120, Safari 17
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Other context, error messages, or notes.
    validations:
      required: false
